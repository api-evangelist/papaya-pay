aid: papaya-pay
name: Papaya Pay
description: >-
  Papaya Payments is a Los Angeles based fintech that operates a mobile-first digital
  billing and bill-pay platform. Businesses in healthcare, government and municipalities,
  utilities, insurance, field services, and debt collection use Papaya to let their
  customers pay bills by photographing a paper statement or scanning a QR code and
  paying over SMS, email, or the Papaya iOS and Android apps, with no account or login
  required. Papaya advertises a Quickpay embeddable payment widget for paper-statement
  and portal integrations, and states that more than 2.5 million Americans have used
  the service. The company markets PCI, HIPAA, and SOC2 compliance. As of this profile
  Papaya publishes no public developer portal, API documentation, or API specification;
  it is a consumer-facing payments product rather than a developer platform. Backed by
  Bessemer Venture Partners.
